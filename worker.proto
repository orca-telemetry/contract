syntax = "proto3";

option go_package = "github.com/orca-telemetry/contract/go";

import "shared.proto";

// Worker defines the service that a worker must implement to start listening
// for execution requests.
// 
// Workers are language-agnostic services that:
// - Execute Data Functions
// - Execute workflow segments, and route them to tasks
//
// Core utilises the workers  to asynchronously schedule task executions (via
// workflow segments) as per the distributed DAG.
service Worker {
  // Execute a data function call
  rpc ExecuteDataFunction(ExecuteDataFunctionRequest) returns (ExecuteDataFunctionResponse);

  // Execute a workflow segment (potentially all of it)
  rpc ExecuteWorkflowSegment(ExecuteWorkflowSegmentRequest) returns (ExecuteWorkflowSegmentResponse);

  // Check the liveness of a worker via a simple heartbeat
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
};

// ============================================================
// ExecuteDataFunction RPC
// ============================================================

message ExecuteDataFunctionRequest {
  // ExecutionParameters is a marshalled JSON struct conforming to the data
  // function's input model.
  string executionParameters = 1;

  // WorkflowRunId is the ID of the workflow run that invoked this data function.
  string workflowRunId = 2;

  // Uri is the location the data function should stream its output to.
  string uri = 3;
}

message ExecuteDataFunctionResponse {
  // Status indicates whether the data function was successfully started or failed.
  ExecutionStatus status = 1;

  // Message provides detail on why the data function failed to start, if applicable.
  string message = 2;
}

// ============================================================
// ExecuteWorkflowSegment RPC
// ============================================================

message ExecuteWorkflowSegmentRequest {
  // WorkflowRunId is the ID generated by the core for this specific workflow run.
  string workflowRunId = 1;

  // ExecutionParameters is a marshalled JSON struct conforming to the
  // workflow's ExecutionParametersModel schema.
  string executionParameters = 2;

  // DataUri is an optional URI pointing to where the data function's output
  // was stored. Omit if no data function was required.
  optional string dataUri = 3;

  // Tasks is the ordered set of tasks to execute in this workflow segment.
  repeated WorkflowTask tasks = 4;
}

message ExecuteWorkflowSegmentResponse {
  // Status indicates whether the segment executed successfully or failed.
  ExecutionStatus status = 1;

  // Message provides detail on why execution failed, if applicable.
  string message = 2;
}

// WorkflowTask describes a single task to execute within a workflow segment.
message WorkflowTask {
  // TaskName is the registered name of the task, used to route to the correct handler.
  string taskName = 1;

  // Parameters is an optional marshalled JSON object of task-specific parameters.
  optional string parameters = 2;
}

// ============================================================
// Heartbeat RPC
// ============================================================

message HeartbeatRequest {
  // WorkerId optionally identifies the worker to the core for logging purposes.
  string workerId = 1;
}

message HeartbeatResponse {
  // Alive confirms the worker is reachable and healthy.
  bool alive = 1;
}
